name: Génération APK 6milles

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installation de Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialisation du projet Android
        run: |
          bubblewrap init --manifest=manifest.json --directory=android-app
          cd android-app
          bubblewrap build

      - name: Téléversement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: 6milles-APK
          path: android-app/*.apk
