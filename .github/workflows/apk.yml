name: Génération APK 6milles

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Préparation du dossier www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ 2>/dev/null || true
          cp logo-famille.png www/ 2>/dev/null || cp icon.png www/ 2>/dev/null || true
          cp -r noeuds www/ 2>/dev/null || true

      - name: Initialisation Capacitor v5
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          npx cap init "6milles" "com.manu.milles6" --web-dir www
          npx cap add android

      - name: Application de l icône Android de la famille
        run: |
          ICON_SRC=""
          if [ -f "logo-famille.png" ]; then ICON_SRC="logo-famille.png"; elif [ -f "icon.png" ]; then ICON_SRC="icon.png"; fi
          
          if [ -n "$ICON_SRC" ]; then
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp "$ICON_SRC" {} \;
          fi

      - name: Configuration des permissions GPS et Réseau (Android)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
          sed -i "/<\/manifest>/i $PERMISSIONS" $MANIFEST
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST

      - name: Configuration Android et Gradle
        run: |
          cd android
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          chmod +x gradlew

      - name: Compilation de l APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Téléversement de l APK
        uses: actions/upload-artifact@v4
        with:
          name: 6milles-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
