name: Génération APK 6milles

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Génération APK avec PWABuilder
        uses: pwabuilder/pwa-action@v1.0.2
        with:
          pwa_url: 'https://chingarre64.github.io/6milles-app/'
          output_dir: 'output'

      - name: Téléversement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: 6milles-APK
          path: output/*.apk
