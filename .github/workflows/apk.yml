name: Génération APK 6milles

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Capacitor et création du projet Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "6milles" "com.manu.milles6" --web-dir .
          npx cap add android --no-confirm
          npx cap copy android

      - name: Compilation de l'APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Téléversement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: 6milles-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
