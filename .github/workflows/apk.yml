name: Génération APK 6milles

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Construction de l'APK Android
        uses: pwa-builder/pwa-action@v2
        with:
          manifest_url: 'https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json'

      - name: Téléversement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: 6milles-APK
          path: '*.apk'
