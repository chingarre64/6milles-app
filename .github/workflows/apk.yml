name: Génération APK 6milles

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installation de Bubblewrap sans prompt
        run: |
          npm install -g @bubblewrap/cli
          echo "y" | bubblewrap init --manifest=manifest.json --directory=android-app || true

      - name: Compilation du projet
        run: |
          cd android-app || exit 1
          bubblewrap build --signingKeyPath="" || true

      - name: Téléversement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: 6milles-APK
          path: android-app/*.apk
