name: Génération APK 6milles

on:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Préparation du dossier www et Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ 2>/dev/null || true
          cp -r noeuds www/ 2>/dev/null || true
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init "6milles" "com.manu.milles6" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Résolution des conflits Kotlin et compilation APK
        run: |
          cd android
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug -Pkotlin.version=1.8.22 --no-daemon

      - name: Téléversement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: 6milles-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
