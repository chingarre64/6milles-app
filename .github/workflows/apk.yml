name: Génération APK 6milles

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Génération du package Android
        run: |
          npx @pwabuilder/cli package -u "https://chingarre64.github.io/6milles-app/" -p android -o ./output

      - name: Téléversement du package APK
        uses: actions/upload-artifact@v4
        with:
          name: 6milles-APK
          path: output/*
